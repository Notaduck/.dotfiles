# Kanagawa Wave (dark) - https://github.com/rebelot/kanagawa.nvim
# Read by ~/.tmux.conf (sourced), lua/config/theme.lua and the theme script.
# Every palette defines the same keys.
set -g @thm_mode      "dark"
set -g @thm_nvim      "kanagawa-wave"
set -g @thm_ghostty   "Kanagawa Wave"
set -g @thm_bat       "ansi"
set -g @thm_omp       "dark-tokyo-night"
set -g @thm_bg        "#1f1f28"   # editor and terminal background
set -g @thm_surface   "#2a2a37"   # statusline sections
set -g @thm_border    "#54546d"   # inactive pane borders
set -g @thm_text      "#dcd7ba"
set -g @thm_subtle    "#c8c093"   # session name, inactive tabs
set -g @thm_muted     "#727169"   # last tab, comments
set -g @thm_accent    "#957fb8"   # current tab, message bar, active border
set -g @thm_on_accent "#1f1f28"   # text drawn on the accent
set -g @thm_insert    "#7e9cd8"   # insert mode
set -g @thm_visual    "#7aa89f"   # visual mode
set -g @thm_warn      "#ffa066"   # copy mode, activity
set -g @thm_alert     "#ff5d62"   # prefix pressed, bell, replace mode
