# Catppuccin Frappe (dark) - https://catppuccin.com
# Read by lua/config/theme.lua and the theme script.
# Every palette defines the same keys.
set -g @thm_mode      "dark"
set -g @thm_nvim      "catppuccin-frappe"
set -g @thm_ghostty   "Catppuccin Frappe"
set -g @thm_bat       "Catppuccin Frappe"
set -g @thm_omp       "dark-catppuccin"
set -g @thm_bg        "#303446"   # editor and terminal background
set -g @thm_surface   "#414559"   # statusline sections
set -g @thm_border    "#51576d"   # inactive pane borders
set -g @thm_text      "#c6d0f5"
set -g @thm_subtle    "#a5adce"   # session name, inactive tabs
set -g @thm_muted     "#737994"   # last tab, comments
set -g @thm_accent    "#ca9ee6"   # current tab, message bar, active border
set -g @thm_on_accent "#303446"   # text drawn on the accent
set -g @thm_insert    "#8caaee"   # insert mode
set -g @thm_visual    "#81c8be"   # visual mode
set -g @thm_warn      "#ef9f76"   # copy mode, activity
set -g @thm_alert     "#e78284"   # prefix pressed, bell, replace mode
