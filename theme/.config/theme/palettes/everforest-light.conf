# Everforest Light (light) - https://github.com/sainnhe/everforest
# Read by ~/.tmux.conf (sourced), lua/config/theme.lua and the theme script.
# Every palette defines the same keys.
set -g @thm_mode      "light"
set -g @thm_nvim      "everforest"
set -g @thm_ghostty   "Everforest Light Med"
set -g @thm_bat       "ansi"
set -g @thm_omp       "light-forest"
set -g @thm_bg        "#fdf6e3"   # editor and terminal background
set -g @thm_surface   "#f4f0d9"   # statusline sections
set -g @thm_border    "#bdc3af"   # inactive pane borders
set -g @thm_text      "#5c6a72"
set -g @thm_subtle    "#829181"   # session name, inactive tabs
set -g @thm_muted     "#939f91"   # last tab, comments
set -g @thm_accent    "#df69ba"   # current tab, message bar, active border
set -g @thm_on_accent "#fdf6e3"   # text drawn on the accent
set -g @thm_insert    "#3a94c5"   # insert mode
set -g @thm_visual    "#35a77c"   # visual mode
set -g @thm_warn      "#f57d26"   # copy mode, activity
set -g @thm_alert     "#f85552"   # prefix pressed, bell, replace mode
