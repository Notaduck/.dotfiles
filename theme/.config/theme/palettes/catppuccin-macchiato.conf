# Catppuccin Macchiato (dark) - https://catppuccin.com
# Read by lua/config/theme.lua and the theme script.
# Every palette defines the same keys.
set -g @thm_mode      "dark"
set -g @thm_nvim      "catppuccin-macchiato"
set -g @thm_ghostty   "Catppuccin Macchiato"
set -g @thm_bat       "Catppuccin Macchiato"
set -g @thm_omp       "dark-catppuccin"
set -g @thm_bg        "#24273a"   # editor and terminal background
set -g @thm_surface   "#363a4f"   # statusline sections
set -g @thm_border    "#494d64"   # inactive pane borders
set -g @thm_text      "#cad3f5"
set -g @thm_subtle    "#a5adcb"   # session name, inactive tabs
set -g @thm_muted     "#6e738d"   # last tab, comments
set -g @thm_accent    "#c6a0f6"   # current tab, message bar, active border
set -g @thm_on_accent "#24273a"   # text drawn on the accent
set -g @thm_insert    "#8aadf4"   # insert mode
set -g @thm_visual    "#8bd5ca"   # visual mode
set -g @thm_warn      "#f5a97f"   # copy mode, activity
set -g @thm_alert     "#ed8796"   # prefix pressed, bell, replace mode
