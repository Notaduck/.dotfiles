# Kanagawa Dragon (dark) - https://github.com/rebelot/kanagawa.nvim
# Read by ~/.tmux.conf (sourced), lua/config/theme.lua and the theme script.
# Every palette defines the same keys.
set -g @thm_mode      "dark"
set -g @thm_nvim      "kanagawa-dragon"
set -g @thm_ghostty   "Kanagawa Dragon"
set -g @thm_bat       "ansi"
set -g @thm_omp       "dark-gruvbox"
set -g @thm_bg        "#181616"   # editor and terminal background
set -g @thm_surface   "#282727"   # statusline sections
set -g @thm_border    "#625e5a"   # inactive pane borders
set -g @thm_text      "#c5c9c5"
set -g @thm_subtle    "#a6a69c"   # session name, inactive tabs
set -g @thm_muted     "#7a8382"   # last tab, comments
set -g @thm_accent    "#8992a7"   # current tab, message bar, active border
set -g @thm_on_accent "#181616"   # text drawn on the accent
set -g @thm_insert    "#8ba4b0"   # insert mode
set -g @thm_visual    "#8ea4a2"   # visual mode
set -g @thm_warn      "#b6927b"   # copy mode, activity
set -g @thm_alert     "#c4746e"   # prefix pressed, bell, replace mode
