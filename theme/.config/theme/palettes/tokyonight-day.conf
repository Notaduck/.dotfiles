# Tokyo Night Day (light) - https://github.com/folke/tokyonight.nvim
# Read by ~/.tmux.conf (sourced), lua/config/theme.lua and the theme script.
# Every palette defines the same keys.
set -g @thm_mode      "light"
set -g @thm_nvim      "tokyonight-day"
set -g @thm_ghostty   "TokyoNight Day"
set -g @thm_bat       "ansi"
set -g @thm_omp       "light-tokyo-night"
set -g @thm_bg        "#e1e2e7"   # editor and terminal background
set -g @thm_surface   "#c4c8da"   # statusline sections
set -g @thm_border    "#a8aecb"   # inactive pane borders
set -g @thm_text      "#3760bf"
set -g @thm_subtle    "#6172b0"   # session name, inactive tabs
set -g @thm_muted     "#848cb5"   # last tab, comments
set -g @thm_accent    "#9854f1"   # current tab, message bar, active border
set -g @thm_on_accent "#e1e2e7"   # text drawn on the accent
set -g @thm_insert    "#2e7de9"   # insert mode
set -g @thm_visual    "#007197"   # visual mode
set -g @thm_warn      "#b15c00"   # copy mode, activity
set -g @thm_alert     "#f52a65"   # prefix pressed, bell, replace mode
