# Tokyo Night Moon (dark) - https://github.com/folke/tokyonight.nvim
# Read by lua/config/theme.lua and the theme script.
# Every palette defines the same keys.
set -g @thm_mode      "dark"
set -g @thm_nvim      "tokyonight-moon"
set -g @thm_ghostty   "TokyoNight Moon"
set -g @thm_bat       "ansi"
set -g @thm_omp       "dark-tokyo-night"
set -g @thm_bg        "#222436"   # editor and terminal background
set -g @thm_surface   "#2f334d"   # statusline sections
set -g @thm_border    "#3b4261"   # inactive pane borders
set -g @thm_text      "#c8d3f5"
set -g @thm_subtle    "#828bb8"   # session name, inactive tabs
set -g @thm_muted     "#7a88cf"   # last tab, comments
set -g @thm_accent    "#c099ff"   # current tab, message bar, active border
set -g @thm_on_accent "#222436"   # text drawn on the accent
set -g @thm_insert    "#82aaff"   # insert mode
set -g @thm_visual    "#86e1fc"   # visual mode
set -g @thm_warn      "#ff966c"   # copy mode, activity
set -g @thm_alert     "#ff757f"   # prefix pressed, bell, replace mode
