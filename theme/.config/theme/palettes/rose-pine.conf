# Rose Pine (dark) - https://rosepinetheme.com
# Read by lua/config/theme.lua and the theme script.
# Every palette defines the same keys.
set -g @thm_mode      "dark"
set -g @thm_nvim      "rose-pine-main"
set -g @thm_ghostty   "rose-pine.conf"
set -g @thm_bat       "ansi"
set -g @thm_omp       "dark-rose-pine"
set -g @thm_bg        "#191724"   # editor and terminal background
set -g @thm_surface   "#26233a"   # statusline sections
set -g @thm_border    "#403d52"   # inactive pane borders
set -g @thm_text      "#e0def4"
set -g @thm_subtle    "#908caa"   # session name, inactive tabs
set -g @thm_muted     "#6e6a86"   # last tab, comments
set -g @thm_accent    "#c4a7e7"   # current tab, message bar, active border
set -g @thm_on_accent "#191724"   # text drawn on the accent
set -g @thm_insert    "#31748f"   # insert mode
set -g @thm_visual    "#9ccfd8"   # visual mode
set -g @thm_warn      "#f6c177"   # copy mode, activity
set -g @thm_alert     "#eb6f92"   # prefix pressed, bell, replace mode
