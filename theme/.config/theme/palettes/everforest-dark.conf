# Everforest Dark (dark) - https://github.com/sainnhe/everforest
# Read by ~/.tmux.conf (sourced), lua/config/theme.lua and the theme script.
# Every palette defines the same keys.
set -g @thm_mode      "dark"
set -g @thm_nvim      "everforest"
set -g @thm_ghostty   "Everforest Dark Med"
set -g @thm_bat       "ansi"
set -g @thm_omp       "dark-forest"
set -g @thm_bg        "#2d353b"   # editor and terminal background
set -g @thm_surface   "#343f44"   # statusline sections
set -g @thm_border    "#475258"   # inactive pane borders
set -g @thm_text      "#d3c6aa"
set -g @thm_subtle    "#9da9a0"   # session name, inactive tabs
set -g @thm_muted     "#859289"   # last tab, comments
set -g @thm_accent    "#d699b6"   # current tab, message bar, active border
set -g @thm_on_accent "#2d353b"   # text drawn on the accent
set -g @thm_insert    "#7fbbb3"   # insert mode
set -g @thm_visual    "#83c092"   # visual mode
set -g @thm_warn      "#e69875"   # copy mode, activity
set -g @thm_alert     "#e67e80"   # prefix pressed, bell, replace mode
