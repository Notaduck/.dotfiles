# Rose Pine Dawn (light) - https://rosepinetheme.com
# Read by lua/config/theme.lua and the theme script.
# Every palette defines the same keys.
set -g @thm_mode      "light"
set -g @thm_nvim      "rose-pine-dawn"
set -g @thm_ghostty   "Rose Pine Dawn"
set -g @thm_bat       "Catppuccin Latte"
set -g @thm_omp       "light-opal"
set -g @thm_bg        "#faf4ed"   # editor and terminal background
set -g @thm_surface   "#f2e9e1"   # statusline sections
set -g @thm_border    "#dfdad9"   # inactive pane borders
set -g @thm_text      "#575279"
set -g @thm_subtle    "#797593"   # session name, inactive tabs
set -g @thm_muted     "#9893a5"   # last tab, comments
set -g @thm_accent    "#907aa9"   # current tab, message bar, active border
set -g @thm_on_accent "#faf4ed"   # text drawn on the accent
set -g @thm_insert    "#286983"   # insert mode
set -g @thm_visual    "#56949f"   # visual mode
set -g @thm_warn      "#ea9d34"   # copy mode, activity
set -g @thm_alert     "#b4637a"   # prefix pressed, bell, replace mode
