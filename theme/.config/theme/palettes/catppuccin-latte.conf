# Catppuccin Latte (light) - https://catppuccin.com
# Read by ~/.tmux.conf (sourced), lua/config/theme.lua and the theme script.
# Every palette defines the same keys.
set -g @thm_mode      "light"
set -g @thm_nvim      "catppuccin-latte"
set -g @thm_ghostty   "Catppuccin Latte"
set -g @thm_bat       "Catppuccin Latte"
set -g @thm_omp       "light-catppuccin"
set -g @thm_bg        "#eff1f5"   # editor and terminal background
set -g @thm_surface   "#ccd0da"   # statusline sections
set -g @thm_border    "#bcc0cc"   # inactive pane borders
set -g @thm_text      "#4c4f69"
set -g @thm_subtle    "#6c6f85"   # session name, inactive tabs
set -g @thm_muted     "#9ca0b0"   # last tab, comments
set -g @thm_accent    "#8839ef"   # current tab, message bar, active border
set -g @thm_on_accent "#eff1f5"   # text drawn on the accent
set -g @thm_insert    "#1e66f5"   # insert mode
set -g @thm_visual    "#179299"   # visual mode
set -g @thm_warn      "#fe640b"   # copy mode, activity
set -g @thm_alert     "#d20f39"   # prefix pressed, bell, replace mode
