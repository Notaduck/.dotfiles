# Kanagawa Lotus (light) - https://github.com/rebelot/kanagawa.nvim
# Read by ~/.tmux.conf (sourced), lua/config/theme.lua and the theme script.
# Every palette defines the same keys.
set -g @thm_mode      "light"
set -g @thm_nvim      "kanagawa-lotus"
set -g @thm_ghostty   "Kanagawa Lotus"
set -g @thm_bat       "Catppuccin Latte"
set -g @thm_omp       "light-gruvbox"
set -g @thm_bg        "#f2ecbc"   # editor and terminal background
set -g @thm_surface   "#e7dba0"   # statusline sections
set -g @thm_border    "#dcd7ba"   # inactive pane borders
set -g @thm_text      "#545464"
set -g @thm_subtle    "#716e61"   # session name, inactive tabs
set -g @thm_muted     "#8a8980"   # last tab, comments
set -g @thm_accent    "#624c83"   # current tab, message bar, active border
set -g @thm_on_accent "#f2ecbc"   # text drawn on the accent
set -g @thm_insert    "#4d699b"   # insert mode
set -g @thm_visual    "#597b75"   # visual mode
set -g @thm_warn      "#cc6d00"   # copy mode, activity
set -g @thm_alert     "#c84053"   # prefix pressed, bell, replace mode
