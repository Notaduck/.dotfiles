# Nord (dark) - https://www.nordtheme.com
# Read by ~/.tmux.conf (sourced), lua/config/theme.lua and the theme script.
# Every palette defines the same keys.
set -g @thm_mode      "dark"
set -g @thm_nvim      "nord"
set -g @thm_ghostty   "Nord"
set -g @thm_bat       "Nord"
set -g @thm_omp       "dark-nord"
set -g @thm_bg        "#2e3440"   # editor and terminal background
set -g @thm_surface   "#3b4252"   # statusline sections
set -g @thm_border    "#4c566a"   # inactive pane borders
set -g @thm_text      "#eceff4"
set -g @thm_subtle    "#d8dee9"   # session name, inactive tabs
set -g @thm_muted     "#616e88"   # last tab, comments
set -g @thm_accent    "#b48ead"   # current tab, message bar, active border
set -g @thm_on_accent "#2e3440"   # text drawn on the accent
set -g @thm_insert    "#81a1c1"   # insert mode
set -g @thm_visual    "#88c0d0"   # visual mode
set -g @thm_warn      "#d08770"   # copy mode, activity
set -g @thm_alert     "#bf616a"   # prefix pressed, bell, replace mode
