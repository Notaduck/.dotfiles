# Dracula (dark) - https://draculatheme.com
# Read by ~/.tmux.conf (sourced), lua/config/theme.lua and the theme script.
# Every palette defines the same keys.
set -g @thm_mode      "dark"
set -g @thm_nvim      "dracula"
set -g @thm_ghostty   "Dracula"
set -g @thm_bat       "Dracula"
set -g @thm_omp       "dark-dracula"
set -g @thm_bg        "#282a36"   # editor and terminal background
set -g @thm_surface   "#343746"   # statusline sections
set -g @thm_border    "#44475a"   # inactive pane borders
set -g @thm_text      "#f8f8f2"
set -g @thm_subtle    "#bdc0d0"   # session name, inactive tabs
set -g @thm_muted     "#6272a4"   # last tab, comments
set -g @thm_accent    "#bd93f9"   # current tab, message bar, active border
set -g @thm_on_accent "#282a36"   # text drawn on the accent
set -g @thm_insert    "#8be9fd"   # insert mode
set -g @thm_visual    "#50fa7b"   # visual mode
set -g @thm_warn      "#ffb86c"   # copy mode, activity
set -g @thm_alert     "#ff5555"   # prefix pressed, bell, replace mode
