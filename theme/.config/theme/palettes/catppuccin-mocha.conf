# Catppuccin Mocha (dark) - https://catppuccin.com
# Read by lua/config/theme.lua and the theme script.
# Every palette defines the same keys.
set -g @thm_mode      "dark"
set -g @thm_nvim      "catppuccin-mocha"
set -g @thm_ghostty   "Catppuccin Mocha"
set -g @thm_bat       "Catppuccin Mocha"
set -g @thm_omp       "dark-catppuccin"
set -g @thm_bg        "#1e1e2e"   # editor and terminal background
set -g @thm_surface   "#313244"   # statusline sections
set -g @thm_border    "#45475a"   # inactive pane borders
set -g @thm_text      "#cdd6f4"
set -g @thm_subtle    "#a6adc8"   # session name, inactive tabs
set -g @thm_muted     "#6c7086"   # last tab, comments
set -g @thm_accent    "#cba6f7"   # current tab, message bar, active border
set -g @thm_on_accent "#1e1e2e"   # text drawn on the accent
set -g @thm_insert    "#89b4fa"   # insert mode
set -g @thm_visual    "#94e2d5"   # visual mode
set -g @thm_warn      "#fab387"   # copy mode, activity
set -g @thm_alert     "#f38ba8"   # prefix pressed, bell, replace mode
