# Tokyo Night Storm (dark) - https://github.com/folke/tokyonight.nvim
# Read by lua/config/theme.lua and the theme script.
# Every palette defines the same keys.
set -g @thm_mode      "dark"
set -g @thm_nvim      "tokyonight-storm"
set -g @thm_ghostty   "TokyoNight Storm"
set -g @thm_bat       "ansi"
set -g @thm_omp       "dark-tokyo-night"
set -g @thm_bg        "#24283b"   # editor and terminal background
set -g @thm_surface   "#292e42"   # statusline sections
set -g @thm_border    "#3b4261"   # inactive pane borders
set -g @thm_text      "#c0caf5"
set -g @thm_subtle    "#a9b1d6"   # session name, inactive tabs
set -g @thm_muted     "#565f89"   # last tab, comments
set -g @thm_accent    "#bb9af7"   # current tab, message bar, active border
set -g @thm_on_accent "#24283b"   # text drawn on the accent
set -g @thm_insert    "#7aa2f7"   # insert mode
set -g @thm_visual    "#7dcfff"   # visual mode
set -g @thm_warn      "#ff9e64"   # copy mode, activity
set -g @thm_alert     "#f7768e"   # prefix pressed, bell, replace mode
