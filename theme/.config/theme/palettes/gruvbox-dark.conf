# Gruvbox Dark (dark) - https://github.com/ellisonleao/gruvbox.nvim
# Read by lua/config/theme.lua and the theme script.
# Every palette defines the same keys.
set -g @thm_mode      "dark"
set -g @thm_nvim      "gruvbox"
set -g @thm_ghostty   "Gruvbox Dark"
set -g @thm_bat       "gruvbox-dark"
set -g @thm_omp       "dark-gruvbox"
set -g @thm_bg        "#282828"   # editor and terminal background
set -g @thm_surface   "#3c3836"   # statusline sections
set -g @thm_border    "#504945"   # inactive pane borders
set -g @thm_text      "#ebdbb2"
set -g @thm_subtle    "#a89984"   # session name, inactive tabs
set -g @thm_muted     "#928374"   # last tab, comments
set -g @thm_accent    "#d3869b"   # current tab, message bar, active border
set -g @thm_on_accent "#282828"   # text drawn on the accent
set -g @thm_insert    "#83a598"   # insert mode
set -g @thm_visual    "#8ec07c"   # visual mode
set -g @thm_warn      "#fe8019"   # copy mode, activity
set -g @thm_alert     "#fb4934"   # prefix pressed, bell, replace mode
