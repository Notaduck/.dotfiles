# Gruvbox Light (light) - https://github.com/ellisonleao/gruvbox.nvim
# Read by ~/.tmux.conf (sourced), lua/config/theme.lua and the theme script.
# Every palette defines the same keys.
set -g @thm_mode      "light"
set -g @thm_nvim      "gruvbox"
set -g @thm_ghostty   "Gruvbox Light"
set -g @thm_bat       "gruvbox-light"
set -g @thm_omp       "light-gruvbox"
set -g @thm_bg        "#fbf1c7"   # editor and terminal background
set -g @thm_surface   "#ebdbb2"   # statusline sections
set -g @thm_border    "#d5c4a1"   # inactive pane borders
set -g @thm_text      "#3c3836"
set -g @thm_subtle    "#7c6f64"   # session name, inactive tabs
set -g @thm_muted     "#928374"   # last tab, comments
set -g @thm_accent    "#8f3f71"   # current tab, message bar, active border
set -g @thm_on_accent "#fbf1c7"   # text drawn on the accent
set -g @thm_insert    "#076678"   # insert mode
set -g @thm_visual    "#427b58"   # visual mode
set -g @thm_warn      "#af3a03"   # copy mode, activity
set -g @thm_alert     "#9d0006"   # prefix pressed, bell, replace mode
