# ---------- Terminal & Environment ----------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -as terminal-features ",xterm-ghostty:RGB:sync"
set -ga update-environment EDITOR
set-option -gw xterm-keys on
set -g word-separators " \t"       # keep dots/colons/slashes in mouse_word for full filenames
set -g focus-events on
set -g history-limit 50000
set -g display-time 4000
set -g status-keys emacs
setw -g mode-keys vi
set -s set-clipboard on
setw -g aggressive-resize on

# Name idle shells after their folder; include the foreground program while it
# is running. Manually renamed windows keep automatic-rename disabled.
setw -g automatic-rename on
setw -g allow-rename off
setw -g automatic-rename-format '#{?pane_in_mode,[tmux],#{?#{==:#{pane_current_command},zsh},#{b:pane_current_path},#{pane_current_command} · #{b:pane_current_path}}}#{?pane_dead, [dead],}'

# Status commands run asynchronously, but each one still starts several
# processes. Once per minute keeps Continuum functional without constant churn.
set -g status-interval 60
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'alacritty,fullscreen'
set -g @continuum-restore 'on'
set -g @continuum-save-interval '60'
set -g @resurrect-save-command-strategy 'pgrep'

# ---------- TPM Plugins ----------
set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'

# Prefer lsd tree on session picker, but degrade gracefully if missing
if-shell -b 'command -v lsd >/dev/null 2>&1' \
  "set -g @sessionx-ls-command 'lsd --tree --color=always --icon=always'" \
  "set -g @sessionx-ls-command 'ls -G'"
set -g @sessionx-bind 's'

# ---------- Minimal status line ----------
set -g status-position top
set -g status on
set -g status-justify absolute-centre
set -g status-left-length 60
set -g status-right-length 32

# Match Ghostty's Rose Pine theme without loading a second theme plugin.
set -g @minimal-tmux-bg "#c4a7e7"
set -g @minimal-tmux-fg "#191724"
set -g @minimal-tmux-status top
set -g @minimal-tmux-justify absolute-centre
set -g @minimal-tmux-use-arrow true
set -g @minimal-tmux-left-arrow ""
set -g @minimal-tmux-right-arrow ""
set -g @minimal-tmux-window-status-format " #W "
set -g @minimal-tmux-expanded-icon "󰊓 "
set -g @minimal-tmux-show-expanded-icon-for-all-tabs true
set -guq @minimal-tmux-show-expanded-icons-for-all-tabs

# Session/mode state stays on the left; the selected layout appears on the
# right. Continuum appends only its zero-output save hook after the theme loads.
set -g @minimal-tmux-left true
set -g @minimal-tmux-right true
set -g @minimal-tmux-indicator false
set -g @minimal-tmux-status-left " #[fg=#{?client_prefix,#eb6f92,#908caa},bold] #S #{?pane_in_mode,#[fg=#f6c177,bold]• #{pane_mode} ,}"
set -g @minimal-tmux-status-left-extra ""
set -g @minimal-tmux-status-right-extra ""
set -g @minimal-tmux-status-right '#{?#{>:#{window_panes},1},#[fg=#908caa]#{@layout-name} ,}'

# Tmux retains pane geometry but not the semantic preset name. These window
# option is updated by the layout bindings below and costs nothing at idle.
setw -g @layout-name custom

# ---------- Navigation & Layout ----------
unbind s
bind c new-window
bind C-p previous-window
bind C-n next-window
bind R source-file ~/.tmux.conf \; display-message 'Sourced ~/.tmux.conf'
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind-key -T choose-tree c new-session

# Familiar layout keys, now with focused-pane promotion and layout tracking.
bind [ swap-pane -d -t :.0 \; select-layout main-vertical \; set-option -w @layout-name main-vertical
bind ] swap-pane -d -t :.0 \; select-layout main-horizontal \; set-option -w @layout-name main-horizontal
bind ( select-layout even-vertical \; set-option -w @layout-name even-vertical
bind ) select-layout even-horizontal \; set-option -w @layout-name even-horizontal

# Copy/paste moved away from the layout keys.
bind y copy-mode
bind Y paste-buffer -p

# A native layout picker plus direct dwm-style preset keys. Each selection also
# records the name displayed at the right edge of the status bar.
bind Space display-menu -x C -y C -T '#[align=centre]Pane layout' \
  '▥  even-horizontal' 1 'select-layout even-horizontal; set-option -w @layout-name even-horizontal' \
  '▤  even-vertical' 2 'select-layout even-vertical; set-option -w @layout-name even-vertical' \
  '⬒  main-horizontal' 3 'swap-pane -d -t :.0; select-layout main-horizontal; set-option -w @layout-name main-horizontal' \
  '◧  main-vertical' 4 'swap-pane -d -t :.0; select-layout main-vertical; set-option -w @layout-name main-vertical' \
  '⊞  tiled' 5 'select-layout tiled; set-option -w @layout-name tiled' \
  '⬓  main-horizontal-mirrored' 6 'swap-pane -d -t :.0; select-layout main-horizontal-mirrored; set-option -w @layout-name main-horizontal-mirrored' \
  '◨  main-vertical-mirrored' 7 'swap-pane -d -t :.0; select-layout main-vertical-mirrored; set-option -w @layout-name main-vertical-mirrored'

bind M-1 select-layout even-horizontal \; set-option -w @layout-name even-horizontal
bind M-2 select-layout even-vertical \; set-option -w @layout-name even-vertical
bind M-3 swap-pane -d -t :.0 \; select-layout main-horizontal \; set-option -w @layout-name main-horizontal
bind M-4 swap-pane -d -t :.0 \; select-layout main-vertical \; set-option -w @layout-name main-vertical
bind M-5 select-layout tiled \; set-option -w @layout-name tiled
bind M-6 swap-pane -d -t :.0 \; select-layout main-horizontal-mirrored \; set-option -w @layout-name main-horizontal-mirrored
bind M-7 swap-pane -d -t :.0 \; select-layout main-vertical-mirrored \; set-option -w @layout-name main-vertical-mirrored

setw -g mouse on
set -g pane-border-lines single

# Keep copy-mode position after mouse selection instead of snapping back to the bottom
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection
bind -T copy-mode MouseDragEnd1Pane send -X copy-selection

# Vim-style keyboard selection; copied text goes to both tmux and Ghostty's
# system clipboard through OSC 52.
bind -T copy-mode-vi v send -X begin-selection
bind -T copy-mode-vi V send -X select-line
bind -T copy-mode-vi C-v send -X rectangle-toggle
bind -T copy-mode-vi y send -X copy-selection-and-cancel
bind -T copy-mode-vi Enter send -X copy-selection-and-cancel

# TPM initializes in the background, so plugin startup never holds up a reload.
# Minimal applies the final tab format first; Continuum then adds one save hook.
set -g status-right ""
run-shell -b '~/.tmux/plugins/tpm/tpm'

# ---------- Rose Pine details ----------
set -g status-style "bg=default,fg=#e0def4"
set -g status-left-style default
set -g status-right-style default
set -g window-status-style "bg=default,fg=#908caa"
set -g window-status-current-style default
set -g window-status-last-style "bg=default,fg=#6e6a86"
set -g window-status-activity-style "bg=default,fg=#f6c177,bold"
set -g window-status-bell-style "bg=default,fg=#eb6f92,bold"
set -g window-status-separator " "
set -g message-style "bg=#c4a7e7,fg=#191724"
set -g message-command-style "bg=#c4a7e7,fg=#191724"
set -g pane-border-style "fg=#403d52"
set -g pane-active-border-style "fg=#c4a7e7"
