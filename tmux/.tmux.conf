# ---------- Terminal & Environment ----------
set -g default-terminal "tmux-256color"
set -ag terminal-overrides ",xterm-256color:RGB"
set -ga update-environment EDITOR
set-option -gw xterm-keys on
set -g word-separators " \t"       # keep dots/colons/slashes in mouse_word for full filenames

set -g status-interval 5            # throttle status redraws for lighter refresh load
set -g @rose_pine_variant 'dawn'
set -g @continuum-boot 'on'
set -g @continuum-boot-options 'alacritty,fullscreen'
set -g @continuum-restore 'on'

# ---------- TPM Plugins ----------
set -g @plugin 'b0o/tmux-autoreload'
set -g @plugin 'jaclu/tmux-menus'
set -g @plugin 'niksingh710/minimal-tmux-status'
set -g @plugin 'omerxx/tmux-sessionx'
set -g @plugin 'rose-pine/tmux'
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-sensible'

# Prefer lsd tree on session picker, but degrade gracefully if missing
if-shell -b 'command -v lsd >/dev/null 2>&1' \
  "set -g @sessionx-ls-command 'lsd --tree --color=always --icon=always'" \
  "set -g @sessionx-ls-command 'ls -G'"
set -g @sessionx-bind 's'

# ---------- UI Palette (Rose Pine Dawn) ----------
set -g @ui-color-text "#575279"
set -g @ui-color-surface "#f2e9e1"
set -g @ui-color-accent "#d7827e"

set -g @minimal-tmux-fg "#ffffff"
set -g @minimal-tmux-bg "#907aa9"
set -g @minimal-tmux-justify "centre"
set -g @minimal-tmux-indicator true
set -g @minimal-tmux-indicator-str ""
set -g @minimal-tmux-status "top"
set -g @minimal-tmux-right true
set -g @minimal-tmux-left true
set -g @minimal-tmux-show-expanded-icons-for-all-tabs true
set -g @minimal-tmux-expanded-icon "󰊓 "
# Include the Claude indicator AND continuum's save hook here so the minimal
# plugin owns the whole right side. continuum's own script sees "continuum_save"
# already present and skips clobbering status-right on reload (no more races).
set -g @minimal-tmux-status-right-extra " #(~/.config/tmux/claude-indicator.sh) #(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh) "
set -g @minimal-tmux-status-left-extra " "
set -g @minimal-tmux-use-arrow true
set -g @minimal-tmux-right-arrow ""
set -g @minimal-tmux-left-arrow ""

set -g status-position top
set -g status 2
set -g status-right-length 40
set -g status-left-length 20

# ---------- Claude Code Integration ----------
# prefix + c + s  → popup list of LIVE Claude Code sessions (jump to pane)
# prefix + c + r  → popup list of PAST conversations (resume in a new window)
# prefix + c + c  → new-window (preserves the default prefix+c behaviour)
bind c switch-client -T claude-keys
bind -T claude-keys s display-popup -E -w 85% -h 70% "~/.config/tmux/claude-sessions.sh"
bind -T claude-keys r display-popup -E -w 85% -h 70% "~/.config/tmux/claude-history.sh"
bind -T claude-keys c new-window

# ---------- Navigation & Layout ----------
unbind s
bind h select-pane -L
bind j select-pane -D
bind k select-pane -U
bind l select-pane -R
bind-key -T choose-tree c new-session

bind [ select-layout main-vertical
bind ] select-layout main-horizontal
bind ( select-layout even-vertical
bind ) select-layout even-horizontal

setw -g mouse on
set -g pane-border-lines single

# Keep copy-mode position after mouse selection instead of snapping back to the bottom
bind -T copy-mode-vi MouseDragEnd1Pane send -X copy-selection
bind -T copy-mode MouseDragEnd1Pane send -X copy-selection

set -Fg 'status-format[1]' '#{status-format[0]}'
set -g 'status-format[1]' ''

# NOTE: not backgrounded (no -b). TPM must load synchronously so the
# post-plugin overrides below genuinely run last and win — otherwise the
# async plugins (rose-pine, continuum) finish after these lines and clobber
# the bar (symptom: bar appears on reload, then styles/tabs disappear).
run '~/.tmux/plugins/tpm/tpm'

# ---------- Post-plugin overrides ----------
# Must run AFTER TPM so plugin styles don't clobber these
# Cream main bar; iris-purple pills are rendered by minimal-tmux-status
set -g status-style          "bg=#faf4ed,fg=#575279"
set -g status-left-style     "bg=#faf4ed,fg=#575279"
set -g status-right-style    "bg=#faf4ed,fg=#575279"
# Pin the right side here (after plugins) so rose-pine/continuum can't clobber it:
# session name + Claude indicator + continuum's periodic-save hook.
set -g status-right-length 60
set -g status-right "#S #(~/.config/tmux/claude-indicator.sh) #(~/.tmux/plugins/tmux-continuum/scripts/continuum_save.sh) "
# Middle window-list: dark text on cream for readability; purple pill for active
set -g window-status-style              "bg=#faf4ed,fg=#575279"
set -g window-status-current-style      "bg=#907aa9,fg=#ffffff,bold"
set -g window-status-last-style         "bg=#faf4ed,fg=#575279"
set -g window-status-activity-style     "bg=#faf4ed,fg=#b4637a"
set -g window-status-bell-style         "bg=#faf4ed,fg=#b4637a,bold"
# Padding inside each window list entry → fakes a rounded pill feel
set -g window-status-format         " #I:#W "
set -g window-status-current-format " #I:#W "
set -g window-status-separator " "
set -g message-style         "bg=#907aa9,fg=#ffffff"
set -g message-command-style "bg=#907aa9,fg=#ffffff"
set -g pane-border-style        "fg=#dfdad9"
set -g pane-active-border-style "fg=#907aa9"
